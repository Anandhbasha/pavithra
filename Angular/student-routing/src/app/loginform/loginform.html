<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <form #studentForm = "ngForm" (ngSubmit)="onSubmit()">
        <label>Name:</label>
        <input type="text" name="name" [(ngModel)] = "student.name" required minlength="3" #name ="ngModel"><br>
        <label>Email:</label>
        <input type="text" name="email" [(ngModel)] = "student.email" required minlength="3" #name ="ngModel"><br>
        <label>Age:</label>
        <input type="number" name="age" [(ngModel)] = "student.age" required minlength="3" #name ="ngModel"><br>
        <label>Course:</label>
        <select name="course" [(ngModel)] ="student.course" required>
            <option value="">Select Course</option>
            <option value="Angular">Angular</option>
            <option value="React">React</option>
            <option value="Java">Java</option>
        </select>
        <br>
        <button type="submit" [disabled]="studentForm.invalid">Register</button>
    </form>
</body>
</html>
